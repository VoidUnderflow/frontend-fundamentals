<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Throttle & Debounce</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Throttle &amp; Debounce</h1>

    <div class="sections">
      <section class="panel" id="debounce-panel">
        <h2>Debounce</h2>
        <p class="description">Type something — the display updates only after you stop typing.</p>
        <input
          type="text"
          id="debounce-input"
          placeholder="Start typing..."
          autocomplete="off"
        />
        <div class="output-box">
          <span class="output-label">Debounced value:</span>
          <span id="debounce-output" class="output-value">&mdash;</span>
        </div>
      </section>

      <section class="panel" id="throttle-panel">
        <h2>Throttle</h2>
        <p class="description">Move your mouse here — the dot follows, but only at a throttled rate.</p>
        <div id="tracker">
          <div id="tracker-dot"></div>
          <div id="tracker-coords">x: &mdash; &nbsp; y: &mdash;</div>
        </div>
      </section>
    </div>

    <script src="index.js"></script>
  </body>
</html>
